<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>استبيان الانضمام إلى مايسترو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow phone column of stacked sections; key fields carry an amber edge that turns green when filled; a sticky bar counts what is left. */
:root{
  --bg:#f1f4f3; --surface:#ffffff; --ink:#13242b; --muted:#5a6b71; --line:#d5dedb;
  --accent:#0d6e69; --accent-ink:#ffffff; --accent-soft:#e0f1ef;
  --key:#b45309; --key-bg:#fff5e1; --ok:#1c7a4c; --ok-bg:#e8f5ed;
  --display:"Changa","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Noto Naskh Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1619; --surface:#162126; --ink:#e7eeec; --muted:#98aaa8; --line:#2a3a40;
    --accent:#45bdb2; --accent-ink:#05211f; --accent-soft:#173532;
    --key:#f0b04a; --key-bg:#2f2510; --ok:#63d199; --ok-bg:#15301f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1619; --surface:#162126; --ink:#e7eeec; --muted:#98aaa8; --line:#2a3a40;
  --accent:#45bdb2; --accent-ink:#05211f; --accent-soft:#173532;
  --key:#f0b04a; --key-bg:#2f2510; --ok:#63d199; --ok-bg:#15301f; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 120px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}
h1{font-family:var(--display);font-size:26px;line-height:1.25;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:19px;margin:0;display:flex;flex-direction:column}
h3{font-size:14px;font-weight:600;margin:0;color:var(--muted);display:flex;flex-direction:column}
.l1{display:block}
.l2{display:block;font-size:.84em;font-weight:400;color:var(--muted);line-height:1.7}
.langs{display:flex;flex-wrap:wrap;gap:6px}
.langs button{font:inherit;font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.f{display:flex;flex-direction:column;gap:6px}
.f.key{border-inline-start:4px solid var(--key);background:var(--key-bg);border-radius:10px;padding:10px 12px}
.f.key.ok{border-inline-start-color:var(--ok);background:var(--ok-bg)}
.lab{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-weight:600;font-size:15px}
.tag{flex:none;font-size:12px;font-weight:600;color:var(--key);border:1px solid currentColor;border-radius:999px;padding:0 8px;line-height:1.7}
.f.key.ok .tag{color:var(--ok)}
input[type=text],input[type=tel],input[type=url],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:46px}
textarea{min-height:76px;resize:vertical}
input[type=tel],input[type=url],input[type=number]{direction:ltr;text-align:start;font-variant-numeric:tabular-nums}
[dir=rtl] input[type=tel],[dir=rtl] input[type=url],[dir=rtl] input[type=number]{text-align:end}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{font-size:13px;color:var(--muted)}
.warn{font-size:13px;color:var(--key);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;text-align:start;padding:8px 14px;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;justify-content:center}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .l2{color:inherit;opacity:.85}
.chip:disabled{opacity:.55;cursor:not-allowed;border-style:dashed}
.chip.big{flex:1 1 44%;font-weight:600}
.panel{border:1.5px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:12px}
.panel > h2{font-size:17px;color:var(--accent)}
.piv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.piv .q{font-size:15px;font-weight:500;flex:1}
.yn{display:flex;gap:6px;flex:none}
.yn{flex-wrap:wrap;justify-content:flex-end}
.yn .chip{min-width:48px;align-items:center;padding:6px 10px}
.yn .chip.no[aria-pressed="true"]{background:var(--muted);border-color:var(--muted);color:var(--surface)}
.bar{position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:528px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bar .row{display:flex;align-items:center;gap:12px}
.left{flex:1;font-size:14px;font-weight:600;color:var(--key)}
.left.ok{color:var(--ok)}
.btn{font:inherit;font-weight:600;font-size:16px;border:0;border-radius:12px;padding:12px 20px;min-height:48px;background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.sm{font-size:14px;min-height:40px;padding:8px 14px}
.done{align-items:stretch}
.status{border-radius:10px;padding:10px 12px;font-weight:600}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.local{background:var(--key-bg);color:var(--key)}
pre.sum{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:14px;background:var(--bg);border-radius:10px;padding:12px;margin:0;max-height:260px;overflow:auto}
.acts{display:flex;flex-wrap:wrap;gap:8px}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
summary{cursor:pointer;font-weight:600}
.list{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.item{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-top:1px solid var(--line);padding-top:6px}
.item small{color:var(--muted);flex:none}
[hidden]{display:none!important}
.badge{display:inline-block;align-self:flex-start;font-size:12px;font-weight:600;line-height:1.7;padding:0 9px;border-radius:999px;background:var(--key-bg);color:var(--key);border:1px solid var(--key);margin-block:2px}
h3 .badge{margin-bottom:4px}
.gate{max-width:380px;margin:0 auto;padding:48px 16px;display:flex;flex-direction:column;gap:14px}
.gate input{font-size:22px;letter-spacing:.2em;text-align:center!important}
@media (prefers-reduced-motion:no-preference){.chip,.btn{transition:background-color .12s,border-color .12s}}
</style>
</head>
<body>
<form class="gate" id="gate" hidden>
  <div class="eyebrow">مايسترو سيرفس · Maestro Service</div>
  <h1>استبيان الانضمام إلى مايسترو</h1>
  <label class="lab" for="code"><span><span class="l1">الرقم السري</span><span class="l2" lang="ur">خفیہ نمبر · Passcode</span></span></label>
  <input id="code" type="tel" inputmode="numeric" autocomplete="off" maxlength="12">
  <div class="warn" id="codeErr" hidden>الرقم غلط · نمبر غلط ہے · Wrong code</div>
  <button class="btn" type="submit">دخول · داخل ہوں · Enter</button>
</form>
<div class="wrap" id="app" hidden>
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <div class="langs" id="langs" role="group" aria-label="Language"></div>
  </header>
  <main id="form" style="display:flex;flex-direction:column;gap:14px"></main>
  <div id="lists" style="display:flex;flex-direction:column;gap:10px"></div>
</div>
<div class="bar" id="bar" hidden><div class="in">
  <div class="warn" id="missing" hidden></div>
  <div class="row"><div class="left" id="left"></div><button class="btn" id="save" type="button"></button></div>
</div></div>

function chips(path,opts,o={}){
  const cur=get(path), many=o.many;
  const btns=opts.map(([v,t])=>{const on=o.invert?!(cur||[]).includes(v):(many?(cur||[]).includes(v):cur===v);const dis=o.disabled&&o.disabled.includes(v);
    return `<button type="button" class="chip ${o.cls||''}" data-k="${many?'many':'one'}" data-path="${path}" data-v="${v}" aria-pressed="${on}" ${dis?'disabled':''}>${L(t)}</button>`}).join('');
  return `<div class="chips">${btns}${o.other?otherChip(path):''}</div>${o.other?otherInput(path):''}`;
}
function otherChip(path){ return `<button type="button" class="chip" data-k="oth" data-v="${okey(path)}" aria-pressed="${!!S.oth[okey(path)]}">${L(T.otherChip)}</button>`; }
function otherInput(path){ const k=okey(path); return S.oth[k]?`<input type="text" id="o-${k}" data-path="othText.${k}" value="${esc(S.othText[k]||'')}" placeholder="${esc(lang==='dual'?T.otherPh[0]:tx(T.otherPh))}" aria-label="${esc(lang==='dual'?T.otherChip[0]:tx(T.otherChip))}">`:''; }
const YND = () => [['y',T.yes],['n',T.no],['dk',T.dk]];
function group(label,inner,o={}){
  const key=o.key, ok=key&&filled(o.key);
  const tag = key?`<span class="tag">${ok?'✓':esc(lang==='dual'?T.key[0]:tx(T.key))}</span>`:'';
  return `<div class="f ${key?'key':''} ${ok?'ok':''}"><div class="lab"><span>${L(label)}</span>${tag}</div>${o.hint?`<div class="hint">${L(o.hint)}</div>`:''}${inner}</div>`;
}
function field(path,label,o={}){
  const v=get(path)||'', key=o.key, ok=key&&filled(path), id='f-'+path.replace(/\./g,'-'), one=a=>lang==='dual'?a[0]:tx(a);
  const tag = key?`<span class="tag">${ok?'✓':esc(one(T.key))}</span>`:'';
  const ph = o.ph?` placeholder="${esc(o.ph)}"`:'';
  const inp = o.area ? `<textarea id="${id}" data-path="${path}"${ph}>${esc(v)}</textarea>` : `<input id="${id}" type="${o.type||'text'}" ${o.mode?`inputmode="${o.mode}"`:''} ${o.ac?`autocomplete="${o.ac}"`:''} data-path="${path}" value="${esc(v)}"${ph}>`;
  const chk = o.cr ? 'cr' : (o.type==='tel' ? 'phone' : '');
  const bad = chk==='cr' ? (v && !crOk(v)) : (chk==='phone' ? (v && !phoneOk(v)) : false);
  const hint = chk ? `<div class="warn" data-check="${chk}" data-for="${path}" ${bad?'':'hidden'}>${esc(one(chk==='cr'?T.crWarn:T.phoneHint))}</div>` : '';
  const sub = o.cr ? `<div class="hint">${L(T.crHint)}</div>` : '';
  return `<div class="f ${key?'key':''} ${ok?'ok':''}" data-wrap="${path}"><label class="lab" for="${id}"><span>${L(label)}</span>${tag}</label>${inp}${hint}${sub}</div>`;
}
const fill = (a,t) => a.map(s=>s.replace('{t}',t));
const optName = (c,id) => { const o=(c.types||c.groups||c.devices||[]).find(x=>x[0]===id); return o?o[1]:[id,id,id]; };
function pivReq(c,st,req){ if(!req) return true; if(c.types) return req.some(r=>(st.types||[]).includes(r)); if(c.groups) return req.some(r=>!(st.off||[]).includes(r)); return true; }
function pivRow(path,label,cur,badge){
  const b=(v,lab,cls)=>`<button type="button" class="chip ${cls}" data-k="one" data-path="${path}" data-v="${v}" aria-pressed="${cur===v}">${L(lab)}</button>`;
  return `<div class="piv"><div class="q">${L(label)}${badge?` <span class="badge">${esc(badge)}</span>`:''}</div><div class="yn">${b('y',T.yes,'')}${b('n',T.no,'no')}${b('dk',T.dk,'no')}</div></div>`;
}
function catPanel(c){
  const st=S.cats[c.id], base='cats.'+c.id, one=a=>lang==='dual'?a[0]:tx(a);
  let h=`<div class="panel"><h2>${L(c.name)}</h2>`;

  if(c.types){
    h+=`<div class="f"><h3>${L(T.typesQ)}</h3>${chips(base+'.types',c.types,{many:true,other:true})}</div>`;

  if(c.groups) h+=`<div class="f"><h3>${L(T.groupsQ)}</h3>${chips(base+'.off',c.groups,{many:true,invert:true,other:true})}</div>`;
  if(c.devices) h+=`<div class="f"><h3>${L(T.devicesQ)}</h3>${chips(base+'.types',c.devices,{many:true,other:true})}</div>`;
  const pv=c.pivots.filter(p=>pivReq(c,st,p[2]));

  h+=field(base+'.top',T.top,{area:1,ph:one(T.topPh)});
  h+='</div>'; return h;
}

function render(){
  document.documentElement.lang = lang==='dual'?'ar':lang; document.documentElement.dir = lang==='en'?'ltr':'rtl';
  document.getElementById('eyebrow').innerHTML=L(T.eyebrow); document.getElementById('title').innerHTML=L(T.title);
  document.getElementById('langs').innerHTML=[['dual','عربي + اردو'],['ar','عربي'],['ur','اردو'],['en','English']].map(([k,n])=>`<button type="button" data-lang="${k}" aria-pressed="${lang===k}">${n}</button>`).join('');
  const f=document.getElementById('form'), bar=document.getElementById('bar');
  if(view==='done'){ bar.hidden=true; f.innerHTML=doneView(); renderLists(); return; }
  bar.hidden=false;
  f.innerHTML = formHTML();
  renderBar(); renderLists();
}
function renderBar(){
  const m=missing(), left=document.getElementById('left'), miss=document.getElementById('missing'), one=a=>lang==='dual'?a[0]:tx(a);
  left.textContent = m.length ? one(T.left).replace('{n}',m.length) : one(T.allDone);
  left.className = 'left'+(m.length?'':' ok');
  if(!m.length) confirmMissing=false;
  miss.hidden = !confirmMissing;
  miss.textContent = confirmMissing ? one(T.missing)+': '+m.map(([,k])=>one(T[k])).join('، ') : '';
  document.getElementById('save').textContent = one(confirmMissing?T.saveAnyway:T.save);
}

/* ---------- بناء السجل والملخص (بالعربي دائمًا للفريق) ---------- */
const ar = (list,v) => {const o=(list||[]).find(x=>x[0]===v);return o?o[1][0]:''};
const arMany = (list,vs,p) => (vs||[]).map(v=>ar(list,v)).filter(Boolean).concat(p&&oText(p)?[oText(p)]:[]).join('، ');
const arOne = (list,v,p) => [ar(list,v), p?oText(p):''].filter(Boolean).join('، ');
const ynd = v => ({y:'نعم',n:'لا',dk:'غير معروف'})[v]||'';
const clean = s => String(s||'').replace(/\s*\(.*?\)\s*/g,' ').replace(/[«»]/g,'').trim();
/* لكل فئة: ملخص نصي للجدول + بيانات منظمة بنفس مفاتيح التطبيق للربط مع لوحة التحكم */
function catInfo(c){
  const st=S.cats[c.id]||{}, base='cats.'+c.id, piv=st.piv||{}, parts=[], data={};
  if(c.types){
    const ty=(st.types||[]); data.types=ty.slice(); if(oText(base+'.types')) data.typesOther=oText(base+'.types');
    const tyTxt=arMany(c.types,ty,base+'.types'); if(tyTxt) parts.push('الأنواع: '+tyTxt);
    data.services={};
    ty.forEach(t=>{ const all=c.typeSvc[t]||[], off=((st.off||{})[t])||[], on=all.filter(s=>!off.includes(s));
      data.services[t]=on;
      parts.push(ar(c.types,t)+': '+(on.map(s=>clean(SV[s][0])).join('، ')||'—')+(off.length?' (ما يسوي: '+off.map(s=>clean(SV[s][0])).join('، ')+')':'')); });
  }
  if(c.groups){
    const off=st.off||[], on=c.groups.map(g=>g[0]).filter(g=>!off.includes(g));
    data.groups=on; if(oText(base+'.off')) data.groupsOther=oText(base+'.off');
    parts.push('يسوي: '+(on.map(g=>clean(ar(c.groups,g))).concat(oText(base+'.off')?[oText(base+'.off')]:[]).join('، ')||'—'));
    if(off.length) parts.push('ما يسوي: '+off.map(g=>clean(ar(c.groups,g))).join('، '));
  }
  if(c.devices){
    data.devices=(st.types||[]).slice(); if(oText(base+'.types')) data.devicesOther=oText(base+'.types');
    const dv=arMany(c.devices,st.types,base+'.types'); if(dv) parts.push('الأجهزة: '+dv);
  }
  data.pivots={};
  c.pivots.filter(p=>pivReq(c,st,p[2])).forEach(([id,t])=>{ if(piv[id]){ data.pivots[id]=piv[id]; parts.push(t[0].replace('؟','')+': '+ynd(piv[id])); } });
  if(c.id==='ac') data.truck=piv.truck||'';
  if(c.contracts) data.contracts=piv.contracts||'';
  data.top=String(st.top||'').trim();
  return {text:parts.join(' | '), data};
}
function buildRec(){
  const ph=s=>digits(s).replace(/[\s-]/g,''), on=CATS.filter(c=>catOn(c.id)), info={};
  on.forEach(c=>info[c.id]=catInfo(c));
  const per=id=>info[id]?info[id].text:'';
  const contracts=on.filter(c=>c.contracts&&info[c.id].data.contracts).map(c=>c.name[0]+': '+ynd(info[c.id].data.contracts)).join('، ');
  const tops=on.filter(c=>info[c.id].data.top).map(c=>c.name[0]+': '+info[c.id].data.top).join(' | ');
  const crTxt = S.shop.cr ? ph(S.shop.cr) : ar(O.crState,S.shop.crState);
  const row={date:new Date().toISOString(),agent:S.agent.trim(),shop:S.shop.name.trim(),district:S.shop.district.trim(),
    interest:ar(O.interest,S.interest),ownerName:S.owner.name.trim(),ownerPhone:ph(S.owner.phone),callTime:arMany(O.callTime,S.callTime,'callTime'),
    contactName:S.contact.name.trim(),contactRole:arOne(O.role,S.contact.role,'contact.role'),contactPhone:ph(S.contact.phone),verify:ar(O.verify,S.contact.verify),contactLang:arOne(O.lang,S.contact.lang,'contact.lang'),
    cr:crTxt,categories:on.map(c=>c.name[0]).concat(oText('cats')?[oText('cats')]:[]).join('، '),
    ac:per('ac'),acTruck:info.ac?ynd(info.ac.data.truck):'',plumbing:per('plumbing'),electrical:per('electrical'),washers:per('washers'),garden:per('garden'),otherCat:oText('cats'),
    contracts,topServices:tops,
    techs:ar(O.techs,S.work.techs),vehicle:arMany(O.vehicle,S.work.vehicle,'work.vehicle'),range:arOne(O.range,S.work.range,'work.range'),
    branch:[ynd(S.work.branch),S.work.branch==='y'?String(S.work.branchWhere||'').trim():''].filter(Boolean).join(': '),
    terminal:ar(O.terminal,S.work.terminal),wallets:ynd(S.work.wallets),appPay:ynd(S.work.appPay),warranty:ynd(S.work.warranty),fee:digits(S.work.fee),
    phones:arMany(O.phones,S.work.phones,'work.phones'),notes:S.notes.trim(),map:S.shop.map.trim()};
  row.data=JSON.stringify({v:3,cr:S.shop.cr?ph(S.shop.cr):'',crState:S.shop.crState||'',categories:Object.fromEntries(on.map(c=>[c.id,info[c.id].data])),otherCategory:oText('cats'),
    work:{techs:S.work.techs||'',vehicle:S.work.vehicle||[],range:S.work.range||'',branch:S.work.branch||'',terminal:S.work.terminal||'',wallets:S.work.wallets||'',appPay:S.work.appPay||'',warranty:S.work.warranty||'',phones:S.work.phones||[]}});
  const ln=(k,v)=>v?k+': '+v:null;
  const text=['تسجيل محل جديد',ln('المحل',row.shop),ln('الحي',row.district),ln('الموقع',row.map),ln('السجل التجاري',row.cr),
    on.length||row.otherCat?'الخدمات:\n- '+on.map(c=>c.name[0]+(info[c.id].text?' ('+info[c.id].text+')':'')).concat(row.otherCat?['أخرى: '+row.otherCat]:[]).join('\n- '):null,
    ln('سيارة نقل مكيفات',row.acTruck),ln('عقود الصيانة',row.contracts),ln('أشهر خدماته',row.topServices),
    ln('عدد الفنيين',row.techs),ln('وسائل التنقّل',row.vehicle),ln('نطاق التغطية',row.range),ln('فرع ثاني',row.branch),
    ln('جهاز الشبكة',row.terminal),ln('STC Pay وبرق',row.wallets),ln('الدفع عن طريق التطبيق',row.appPay),ln('ضمان',row.warranty),ln('رسوم الزيارة',row.fee),ln('جوالات الفنيين',row.phones),
    ln('اللي كلمته',[row.contactName,row.contactRole,row.contactPhone].filter(Boolean).join(' / ')),ln('توثيق الرقم',row.verify),ln('لغته',row.contactLang),
    ln('جوال المالك',row.ownerPhone+(row.ownerName?' ('+row.ownerName+')':'')),ln('أفضل وقت للتواصل مع المالك',row.callTime),ln('الاهتمام',row.interest),
    ln('ملاحظات',row.notes),ln('الموظف',row.agent)].filter(Boolean).join('\n');
  return {id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),row,text,data:JSON.parse(JSON.stringify(S)),synced:false};
}
const COLS=[['date','التاريخ'],['agent','الموظف'],['shop','اسم المحل'],['district','الحي'],['interest','مهتم ينضم؟'],['ownerName','اسم المالك'],['ownerPhone','جوال المالك'],['callTime','أفضل وقت للتواصل مع المالك'],['contactName','اللي كلمه'],['contactRole','وظيفته'],['contactPhone','جواله'],['verify','توثيق الرقم'],['contactLang','لغته'],['cr','السجل التجاري'],['categories','الفئات'],['ac','مكيفات'],['acTruck','سيارة نقل مكيفات'],['plumbing','سباكة'],['electrical','كهرباء'],['washers','غسالات'],['garden','حدائق'],['otherCat','فئات أخرى'],['contracts','مهتم بعقود الصيانة'],['topServices','أشهر خدماته'],['techs','عدد الفنيين'],['vehicle','وسائل التنقّل'],['range','نطاق التغطية'],['branch','فرع ثاني'],['terminal','جهاز الشبكة'],['wallets','STC Pay وبرق'],['appPay','الدفع عن طريق التطبيق'],['warranty','ضمان'],['fee','رسوم الزيارة'],['phones','جوالات الفنيين'],['notes','ملاحظات'],['map','الموقع']];
const tsv = recs => [COLS.map(c=>c[1]).join('\t')].concat(recs.map(r=>COLS.map(c=>String((r.row||{})[c[0]]??'').replace(/[\t\n\r]+/g,' ')).join('\t'))).join('\n');

/* ---------- الحفظ ---------- */
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxNcW_1jnjyB0uahhhK_7bic6kMd6GtxfRD082zTmpkzmioCj9Ke5Vxow42X9DDEnPAnA/exec';
const canSync = () => !!db || /^https:/.test(SHEET_URL);
async function pushRec(rec){
  if(db){
    try{ await db.collection('shops').doc(rec.id).set({row:rec.row,text:rec.text,data:rec.data}); rec.synced=true; LS.set('shopSurvey.saved',mine); return true; }catch(e){ return false; }
  }
  if(!/^https:/.test(SHEET_URL)) return false;
  try{
    const ctl = new AbortController(); const tm = setTimeout(()=>ctl.abort(), 25000);
    const r = await fetch(SHEET_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({code:LS.get('shopSurvey.code',''),id:rec.id,row:rec.row}),signal:ctl.signal});
    clearTimeout(tm);
    const j = await r.json();
    if(j && j.ok){ rec.synced=true; LS.set('shopSurvey.saved',mine); return true; }
  }catch(e){}
  return false;
}
let syncing = false;
async function syncPending(){
  if(syncing||!canSync()) return; syncing=true;
  try{ for(const r of mine.filter(x=>!x.synced)) await pushRec(r); } finally { syncing=false; }
  if(view==='done') render(); else renderLists();
}
async function save(){
  const m=missing();
  if(m.length && !confirmMissing){ confirmMissing=true; renderBar(); return; }
  const btn=document.getElementById('save'); btn.disabled=true; btn.textContent=lang==='dual'?T.sending[0]:tx(T.sending);
  const rec=buildRec(); mine.unshift(rec); LS.set('shopSurvey.saved',mine);
  LS.set('shopSurvey.agent',S.agent); LS.set('shopSurvey.draft',null);
  await pushRec(rec);
  btn.disabled=false; lastRec=rec; view='done'; confirmMissing=false; flash=''; render(); window.scrollTo(0,0);
}
function doneView(){
  const r=lastRec, one=a=>lang==='dual'?a[0]:tx(a);
  return `<section class="done"><h2>${L(T.saved)}</h2>
    <div class="status ${r.synced?'ok':'local'}">${L(r.synced?T.synced:(canSync()?T.notSent:T.local))}</div>
    ${!r.synced&&canSync()?`<button type="button" class="btn" id="retry">${esc(one(T.retry))}</button>`:''}
    <pre class="sum" id="sum" dir="rtl">${esc(r.text)}</pre>
    <div class="acts">
      <a class="btn ${r.synced?'ghost':''}" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(r.text)}">${esc(one(T.wa))}</a>
      <button type="button" class="btn ghost" data-copy="sum">${esc(one(T.copy))}</button>
    </div>
    <div class="hint" id="flash">${esc(flash)}</div>
    <button type="button" class="btn" id="newShop">${esc(one(T.newShop))}</button></section>`;
}
function renderLists(){
  const one=a=>lang==='dual'?a[0]:tx(a), box=document.getElementById('lists'); let h='';
  const item=(r,extra)=>`<div class="item"><span>${esc((r.row||{}).shop||'—')} · ${esc((r.row||{}).district||'')}</span><small>${extra}</small></div>`;
  if(mine.length){ const pend=mine.filter(r=>!r.synced).length;
    h+=`<details><summary>${esc(one(T.mine))} (${mine.length})</summary><div class="list">${mine.map(r=>item(r,r.synced?esc(one(T.synced)):esc(one(T.onPhone)))).join('')}</div><div class="acts"><button type="button" class="btn ghost sm" data-tsv="mine">${esc(one(T.copyAll))}</button>${canSync()&&pend?`<button type="button" class="btn sm" id="upload">${esc(one(T.upload))} (${pend})</button>`:''}</div><div class="hint" id="flash-mine"></div></details>`; }
  if(team&&team.length){
    h+=`<details><summary>${esc(one(T.team))} (${team.length})</summary><div class="list">${team.map(r=>item(r,esc(String((r.row||{}).date||'').slice(0,10)))).join('')}</div><div class="acts"><button type="button" class="btn ghost sm" data-tsv="team">${esc(one(T.copyAll))}</button></div><div class="hint" id="flash-team"></div></details>`;
  } else if(db&&teamSlow&&team===null){ h+=`<div class="hint">${esc(one(T.slow))}</div>`; }
  box.innerHTML=h;
}
async function copyText(text,flashId){
  const one=a=>lang==='dual'?a[0]:tx(a), el=document.getElementById(flashId);
  try{ await navigator.clipboard.writeText(text); if(el) el.textContent=one(T.copied); }
  catch(e){ if(el) el.textContent=one(T.copyFail); }
}

/* ---------- الأحداث ---------- */
let draftTimer=null;
const saveDraft=()=>{clearTimeout(draftTimer);draftTimer=setTimeout(()=>LS.set('shopSurvey.draft',S),400)};
document.addEventListener('input',e=>{
  const p=e.target.dataset&&e.target.dataset.path; if(!p) return;
  set(p,e.target.value); saveDraft();
  const w=document.querySelector(`[data-wrap="${p}"]`);
  if(w&&w.classList.contains('key')){const ok=filled(p);w.classList.toggle('ok',ok);const t=w.querySelector('.tag');if(t)t.textContent=ok?'✓':(lang==='dual'?T.key[0]:tx(T.key))}
  const hint=document.querySelector(`[data-for="${p}"]`); if(hint) hint.hidden=!e.target.value||(hint.dataset.check==='cr'?crOk(e.target.value):phoneOk(e.target.value));
  if(p==='shop.cr'&&e.target.value&&S.shop.crState){ S.shop.crState=''; document.querySelectorAll('[data-path="shop.crState"]').forEach(x=>x.setAttribute('aria-pressed','false')); }
  if(p==='othText.cats'){const g=document.querySelector('.f.key:has([data-k="cat"])');if(g){const ok=filled('#serv');g.classList.toggle('ok',ok);const t=g.querySelector('.tag');if(t)t.textContent=ok?'✓':(lang==='dual'?T.key[0]:tx(T.key))}}
  renderBar();
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-copy]'); if(!b) return;
  if(b.dataset.lang){ lang=b.dataset.lang; LS.set('shopSurvey.lang',lang); render(); return; }
  if(b.id==='save'){ save(); return; }
  if(b.id==='locBtn'){ const one=a=>lang==='dual'?a[0]:tx(a);
    if(!navigator.geolocation){ locMsg=one(T.locErr); render(); return; }
    b.disabled=true; b.textContent=one(T.locWait);
    navigator.geolocation.getCurrentPosition(pos=>{ const la=pos.coords.latitude.toFixed(6), lo=pos.coords.longitude.toFixed(6);
      S.shop.map='https://maps.google.com/?q='+la+','+lo; saveDraft(); locMsg=one(T.locOk)+' (± '+Math.round(pos.coords.accuracy)+' م)'; render(); },
      ()=>{ locMsg=one(T.locErr); render(); }, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
    return; }
  if(b.id==='newShop'){ locMsg=''; S=fresh(); view='form'; lastRec=null; render(); window.scrollTo(0,0); return; }
  if(b.id==='upload'||b.id==='retry'){ b.disabled=true; b.textContent=lang==='dual'?T.sending[0]:tx(T.sending); syncPending(); return; }
  if(b.dataset.copy){ copyText(document.getElementById(b.dataset.copy).textContent,'flash'); return; }
  if(b.dataset.tsv){ copyText(tsv(b.dataset.tsv==='team'?team:mine),'flash-'+b.dataset.tsv); return; }
  const k=b.dataset.k; if(!k) return;
  const v=b.dataset.v, p=b.dataset.path;
  if(k==='oth'){ S.oth[v]=!S.oth[v]; saveDraft(); render(); const i=document.getElementById('o-'+v); if(i) i.focus(); return; }
  if(k==='cat'){ const st=S.cats[v]||(S.cats[v]={on:false,types:[],off:(v==='ac'?{}:[]),piv:{},top:''}); st.on=!st.on; }
  else if(k==='one'){ set(p, get(p)===v?'':v); }
  else if(k==='many'){ const a=(get(p)||[]).slice(); const i=a.indexOf(v); i<0?a.push(v):a.splice(i,1); set(p,a); }
  saveDraft(); render();
});

/* ---------- قاعدة بيانات الفريق (لو متاحة لهذا المستخدم) ---------- */
(async()=>{
  try{
    if(!window.claude||!window.claude.use) return;
    db = await window.claude.use('db');
    if(!db) return;
    const timer=setTimeout(()=>{teamSlow=true;renderLists()},10000);
    db.collection('shops').onSnapshot(s=>{ if(!s.metadata.fromCache) clearTimeout(timer); teamSlow=false; team=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>String((b.row||{}).date).localeCompare(String((a.row||{}).date))); renderLists(); },()=>{clearTimeout(timer);team=[];renderLists()});
    renderLists();
  }catch(e){}
})();
/* ---------- الرقم السري: حاجز خفيف داخل الصفحة، مو حماية خادم ---------- */
const CODE_HASH = 3845451957;
const fnv = s => {let h=0x811c9dc5;for(const c of digits(s).trim()){h^=c.charCodeAt(0);h=Math.imul(h,0x01000193)>>>0}return h};
function unlock(){ document.getElementById('gate').hidden=true; document.getElementById('app').hidden=false; render(); syncPending(); }
if(fnv(LS.get('shopSurvey.code',''))===CODE_HASH) unlock(); else document.getElementById('gate').hidden=false;
window.addEventListener('online', ()=>syncPending());
document.getElementById('gate').addEventListener('submit',e=>{ e.preventDefault(); const v=document.getElementById('code').value;
  if(fnv(v)===CODE_HASH){ LS.set('shopSurvey.code',digits(v).trim()); unlock(); } else { document.getElementById('codeErr').hidden=false; } });
</script>
